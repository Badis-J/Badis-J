name: Update profile animations

on:
  schedule:
    - cron: "17 3 * * *"      # every day at 03:17 UTC
  workflow_dispatch:           # manual run button (Actions tab)
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  activity-card:
    name: Activity card (commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets/activity.svg
        env:
          # PROFILE_TOKEN is optional (fine-grained or classic PAT with read:user).
          # Without it, the default token is used and only public activity may be counted.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/make_activity.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: refresh activity card"
            git push
          fi

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
