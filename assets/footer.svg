<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b3d2e"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="70" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="69" rx="12" fill="none" stroke="#00ff9c" stroke-opacity="0.25"/>
  <text x="30" y="42" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#00ff9c">$ <tspan fill="#e6edf3">exit 0</tspan><tspan fill="#6e7681">   # thanks for stopping by</tspan></text>
  <rect x="960" y="26" width="10" height="20" fill="#00ff9c">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
